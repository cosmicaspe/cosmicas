<body data-p="catalogo">
<main>
<h1 class="tit">CATÁLOGO</h1>
<div class="filt">
<label>CATEGORÍA <select id="fc"><option value="">Todas</option></select></label>
<label>TALLA <select id="ft"><option value="">Todas</option></select></label>
<label><input type="checkbox" id="fd"> SOLO DISPONIBLES</label>
<label>ORDENAR <select id="fo"><option value="">Destacados</option><option value="pa">Precio: menor a mayor</option><option value="pd">Precio: mayor a menor</option><option value="n">Nombre A-Z</option></select></label>
<span class="cuenta" id="cuenta" aria-live="polite"></span>
</div>
<div class="grid" id="grid"><p class="vacio">Cargando anillos…</p></div>
</main>
<div class="ov" id="ov"><div class="fi" id="fi" role="dialog" aria-modal="true" aria-label="Detalle del anillo"></div></div>
<aside class="cart" id="cart" aria-label="Mi pedido" aria-hidden="true">
<button class="x" data-cc aria-label="Cerrar mi pedido">×</button>
<h2>MI PEDIDO</h2>
<div class="items" id="items"></div>
<div class="tot"><div>TOTAL <b id="tot">S/ 0</b></div><p>El envío se cotiza aparte por WhatsApp.</p><a class="btn" id="envia" href="#" aria-disabled="true" rel="noopener">ENVIAR PEDIDO POR WHATSAPP</a></div>
</aside>
